<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Skull — Render</title>
<!--
  The fallback for browsers that can't draw the background live: the site's own elements
  (src/components/public/background/*.js), in loop mode so the video repeats seamlessly.
  Preview: npm run preview → http://localhost:5173/skull.html?seed=42
  Render:  ?render=1&seed=42 exposes window.ready and window.renderFrame(i) for render.mjs.
  Output is grayscale; the site tints it with the active palette.
-->
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url(./node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #info { position: fixed; left: 12px; bottom: 10px; font: 12px 'IBM Plex Mono', monospace; color: #888; }
  .render #info { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info"></div>

<script type="module">
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const SEED = (Number(params.get('seed')) >>> 0) || ((Math.random() * 2 ** 32) >>> 0);
const LOOP = 20;            // seconds; the elements make every motion periodic over it
const FPS = 30;
// Grayscale stand-ins for bg, g1, g2, g3 (relative to g1 in the site palettes); the site multiplies by --g1.
const COLORS = '#000000,#ffffff,#b3b3b3,#737373';
if (RENDER) document.body.classList.add('render');

let field, skulls;
// Set synchronously: render.mjs reads it right after the page loads.
window.ready = (async () => {
  await import('/src/components/public/background/ascii-bg.js');
  await import('/src/components/public/background/skull-ascii.js');
  const stage = document.getElementById('stage');
  stage.innerHTML = `<ascii-bg dim="0.35" colors="${COLORS}" loop="${LOOP}" manual></ascii-bg>`
    + `<skull-ascii colors="${COLORS}" seed="${SEED}" loop="${LOOP}" manual></skull-ascii>`;
  [field, skulls] = stage.children;
  await document.fonts.load(`12px 'IBM Plex Mono'`);
  if (!(await skulls.ready)) throw new Error('WebGL2 is not available');
  return { seed: SEED, loop: LOOP, fps: FPS, frames: LOOP * FPS };
})();
window.renderFrame = (i) => { field.renderAt(i / FPS); skulls.renderAt(i / FPS); };

if (!RENDER) {
  document.getElementById('info').textContent = `seed ${SEED}`;
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = (t) => { window.renderFrame(((t - t0) / 1000) * FPS); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
