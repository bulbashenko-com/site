name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: How to deploy
        run: |
          {
            echo "### ghcr.io/${{ github.repository }}:${{ github.sha }}"
            echo
            echo "Deploys are GitOps: production runs the tag pinned in bulbashenko-com/infra"
            echo "\`apps/production/site/kustomization.yaml\`. The \`promote\` job below asks infra for the"
            echo "deploy PR \`deploy/site\`; merging it deploys this image."
          } >> "$GITHUB_STEP_SUMMARY"

  # Opens or refreshes the production deploy PR in bulbashenko-com/infra (the owner merges it).
  promote:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: bulbashenko-com/infra/.github/workflows/request-promote.yml@main
    with:
      app: site
      sha: ${{ github.sha }}
    secrets: inherit
